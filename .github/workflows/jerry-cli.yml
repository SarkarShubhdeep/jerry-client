name: jerry-cli

on:
  push:
    branches: [main, 'jerry-cli/**']
    paths:
      - 'jerry-cli/**'
      - '.github/workflows/jerry-cli.yml'
  pull_request:
    paths:
      - 'jerry-cli/**'
      - '.github/workflows/jerry-cli.yml'

defaults:
  run:
    working-directory: jerry-cli

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('jerry-cli/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-
      - name: Build
        run: deno task build
      - name: Lint
        run: deno task lint
      - name: Check formatting
        run: deno task fmt --check
      - name: Test CLI help
        run: deno task jerry --help
      - name: Test config show
        run: deno task jerry config show
